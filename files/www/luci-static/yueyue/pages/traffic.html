<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时流量 · 月月岛科技</title>
<style>
:root{
  --bg:#0F1A19; --bg2:rgba(18,34,32,.82); --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.18);
  --accent:#7fe7d2; --accent2:#2fbfa0; --accent-dim:rgba(127,231,210,.16);
  --text:#d8ede9; --muted:#7f9a95; --warn:#ff7a85; --ok:#7fe7d2; --down:#7fc4ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    linear-gradient(rgba(15,26,25,.72), rgba(15,26,25,.88)),
    url('../assets/bg-BbiUDa6X.webp') center/cover no-repeat fixed,
    var(--bg);
  color:var(--text); font-family:"Noto Sans SC","Zen Maru Gothic",system-ui,-apple-system,sans-serif;
  padding:22px; overflow-y:auto;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.head img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(127,231,210,.25))}
.head h1{font-size:19px;letter-spacing:.5px}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--border2);border-radius:99px;padding:4px 12px}
.badge.live{color:var(--ok);border-color:rgba(127,231,210,.4)}
.badge.demo{color:var(--warn);border-color:rgba(255,122,133,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px 18px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card .k{font-size:11.5px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.card .v{font-size:24px;font-weight:700}
.card .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.chartwrap{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin-bottom:16px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.chartwrap h2{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:1px;margin-bottom:10px}
canvas{width:100%;height:220px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:500;text-align:left;font-size:11px;letter-spacing:1px;padding:8px 12px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px dashed var(--border)}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;border:1px solid var(--border2)}
.up{color:var(--ok);border-color:rgba(127,231,210,.35)}
.down{color:var(--warn);border-color:rgba(255,122,133,.35)}
.rx{color:var(--down)} .tx{color:var(--accent)}
.footer{margin-top:14px;font-size:11px;color:var(--muted);letter-spacing:.5px}
</style>
</head>
<body>
  <div class="head">
    <img src="../assets/logo-DE7xEWH4.png" alt="">
    <h1>实时流量</h1>
    <span class="badge live mono" id="status">● LIVE</span>
    <span class="badge mono" id="clock">--:--:--</span>
    <span class="badge mono">月月岛科技 · 企业路由</span>
  </div>

  <div class="grid">
    <div class="card"><div class="k">当前下行 ↓</div><div class="v rx" id="rxNow">—<small>KB/s</small></div></div>
    <div class="card"><div class="k">当前上行 ↑</div><div class="v tx" id="txNow">—<small>KB/s</small></div></div>
    <div class="card"><div class="k">累计接收</div><div class="v" id="rxTotal">—<small>GB</small></div></div>
    <div class="card"><div class="k">累计发送</div><div class="v" id="txTotal">—<small>GB</small></div></div>
  </div>

  <div class="chartwrap">
    <h2>吞吐趋势（最近 2 分钟 · 2 秒采样）</h2>
    <canvas id="chart"></canvas>
  </div>

  <div class="chartwrap">
    <h2>接口明细</h2>
    <table>
      <thead><tr><th>接口</th><th>状态</th><th>下行速率</th><th>上行速率</th><th>累计接收</th><th>累计发送</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="footer mono">数据源 /proc/net/dev · 采样间隔 2s · yueyueconsole sysinfo API</div>

<script>
var API = "/cgi-bin/luci/admin/yueroute/api/sysinfo";
var HIST = { rx: [], tx: [] }, PREV = null, DEMO = false;

function $(id){ return document.getElementById(id); }
function fmt(bps, isRate){
  if (isRate) {
    var v = bps;
    if (v < 1024) return [v.toFixed(0), "B/s"];
    if (v < 1048576) return [(v/1024).toFixed(1), "KB/s"];
    return [(v/1048576).toFixed(2), "MB/s"];
  }
  var v = bps;
  if (v < 1048576) return [(v/1024).toFixed(1), "KB"];
  if (v < 1073741824) return [(v/1048576).toFixed(1), "MB"];
  return [(v/1073741824).toFixed(2), "GB"];
}
function set(id, val, unit){ $(id).innerHTML = val + '<small>' + unit + '</small>'; }

function drawChart(){
  var c = $("chart"), dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth, h = 220;
  c.width = w * dpr; c.height = h * dpr;
  var x = c.getContext("2d"); x.scale(dpr, dpr); x.clearRect(0, 0, w, h);
  // grid
  x.strokeStyle = "rgba(255,255,255,.07)"; x.lineWidth = 1;
  for (var g = 0; g <= 4; g++) { var y = 12 + (h - 32) * g / 4; x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke(); }
  var max = 1;
  HIST.rx.concat(HIST.tx).forEach(function(v){ if (v > max) max = v; });
  max *= 1.15;
  function line(arr, color, fill){
    if (arr.length < 2) return;
    x.beginPath();
    arr.forEach(function(v, i){
      var px = w * i / (arr.length - 1), py = 12 + (h - 32) * (1 - v / max);
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    });
    x.strokeStyle = color; x.lineWidth = 2; x.stroke();
    if (fill) {
      x.lineTo(w, h - 20); x.lineTo(0, h - 20); x.closePath();
      x.fillStyle = fill; x.fill();
    }
  }
  line(HIST.rx, "#7fc4ff", "rgba(127,196,255,.12)");
  line(HIST.tx, "#7fe7d2", "rgba(127,231,210,.10)");
  // legend
  x.font = "11px monospace";
  x.fillStyle = "#7fc4ff"; x.fillText("↓ 下行 " + fmt(HIST.rx[HIST.rx.length-1] || 0, true)[0] + " " + fmt(HIST.rx[HIST.rx.length-1] || 0, true)[1], 8, 214);
  x.fillStyle = "#7fe7d2"; x.fillText("↑ 上行 " + fmt(HIST.tx[HIST.tx.length-1] || 0, true)[0] + " " + fmt(HIST.tx[HIST.tx.length-1] || 0, true)[1], 140, 214);
}

function renderRows(list, rates){
  $("rows").innerHTML = list.map(function(it){
    var r = rates[it.name] || { rx: 0, tx: 0 };
    var rxs = fmt(r.rx, true), txs = fmt(r.tx, true);
    var rxT = fmt(it.rx, false), txT = fmt(it.tx, false);
    return '<tr><td class="mono">' + it.name + '</td>' +
      '<td><span class="pill ' + (it.up ? 'up">● 在线' : 'down">○ 离线') + '</span></td>' +
      '<td class="rx mono">' + rxs[0] + ' ' + rxs[1] + '</td>' +
      '<td class="tx mono">' + txs[0] + ' ' + txs[1] + '</td>' +
      '<td class="mono">' + rxT[0] + ' ' + rxT[1] + '</td>' +
      '<td class="mono">' + txT[0] + ' ' + txT[1] + '</td></tr>';
  }).join("");
}

function demoSample(){
  DEMO = true;
  $("status").textContent = "● 演示数据"; $("status").className = "badge demo mono";
  var t = Date.now() / 1000;
  var rx = 320000 + Math.sin(t / 6) * 220000 + Math.random() * 90000;
  var tx = 90000 + Math.cos(t / 8) * 60000 + Math.random() * 30000;
  return { demo: true, net: {
      "br-lan": { rx: 5.2e8 + t * 1200, tx: 1.1e8 + t * 400 },
      "eth0":   { rx: 5.6e8 + t * 1300, tx: 1.3e8 + t * 500 },
      "eth1":   { rx: 2.1e8 + t * 600,  tx: 4.2e7 + t * 120 }
    },
    ifaces: [
      { name: "br-lan", up: true }, { name: "eth0", up: true }, { name: "eth1", up: false }
    ],
    _forceRates: { "br-lan": { rx: rx * .8, tx: tx * .6 }, "eth0": { rx: rx, tx: tx }, "eth1": { rx: 0, tx: 0 } }
  };
}

function ingest(d){
  var names = Object.keys(d.net || {});
  var rates = d._forceRates || {};
  if (!d._forceRates) {
    if (PREV) {
      var dt = Math.max(1, (Date.now() - PREV.t) / 1000);
      names.forEach(function(n){
        var p = PREV.net[n], c = d.net[n];
        rates[n] = p ? {
          rx: Math.max(0, (c.rx - p.rx) / dt),
          tx: Math.max(0, (c.tx - p.tx) / dt)
        } : { rx: 0, tx: 0 };
      });
    } else {
      names.forEach(function(n){ rates[n] = { rx: 0, tx: 0 }; });
    }
    PREV = { t: Date.now(), net: d.net };
  }
  var rx = 0, tx = 0, rxT = 0, txT = 0;
  names.forEach(function(n){ rx += rates[n].rx; tx += rates[n].tx; rxT += d.net[n].rx; txT += d.net[n].tx; });
  HIST.rx.push(rx); HIST.tx.push(tx);
  if (HIST.rx.length > 60) { HIST.rx.shift(); HIST.tx.shift(); }
  var r1 = fmt(rx, true), t1 = fmt(tx, true), r2 = fmt(rxT, false), t2 = fmt(txT, false);
  set("rxNow", r1[0], r1[1]); set("txNow", t1[0], t1[1]);
  set("rxTotal", r2[0], r2[1]); set("txTotal", t2[0], t2[1]);
  var list = names.map(function(n){
    var up = true;
    (d.ifaces || []).forEach(function(it){ if (it.name === n) up = it.up; });
    return { name: n, rx: d.net[n].rx, tx: d.net[n].tx, up: up };
  });
  renderRows(list, rates);
  drawChart();
}

function tick(){
  $("clock").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  fetch(API, { credentials: "same-origin" })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.net) { ingest(d); } else { ingest(demoSample()); } })
    .catch(function(){ ingest(demoSample()); });
}
window.addEventListener("resize", drawChart);
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
